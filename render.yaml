services:
  - type: web
    name: animesaturn-api
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -r server/requirements.txt && pip install -e .
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
